name: Deploy to GitHub Pages

on:
    # Runs on manual trigger
    workflow_dispatch:

    # Deploy on every push to main. This deliberately has no `paths` filter:
    # source-only commits (components, CSS) are just as deployable as data
    # changes, and filtering them out silently left production a commit behind.
    push:
        branches:
            - main

# Members editing scores and lists on the site produce one commit per save, and
# a burst of saves would otherwise queue a full build each. Only the newest one
# matters: the derived-data steps below are idempotent, so a cancelled run
# leaves nothing half-applied.
concurrency:
    group: pages-deploy
    cancel-in-progress: true

# Fix for permission issue - changed to write
# `actions: read` is for the wait job, which lists this workflow's runs.
permissions:
    contents: write
    pages: write
    id-token: write
    actions: read

jobs:
    # Waits out a burst of reactions.
    #
    # Reaction and comment commits carry `[deferred deploy]` (`DEFER_DEPLOY` in
    # worker/src/github.ts). A member reacting down the wall commits once per
    # tap, and each of those runs would otherwise build the whole site. So this
    # waits until a minute after the commit, then stands down if a newer run of
    # this workflow exists: that run deploys this commit too.
    #
    # The concurrency group above would cancel this run eventually anyway, but
    # GitHub has been seen taking over a minute to deliver that cancel, long
    # enough for every run in a burst to build. Asking is what makes it reliable.
    # Measuring from the commit rather than from now means a run that sat queued
    # behind the one it superseded doesn't wait a second minute.
    wait:
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deferred deploy]')
        outputs:
            superseded: ${{ steps.check.outputs.superseded }}
        steps:
            - name: Wait for a burst of reactions to finish
              id: check
              run: |
                  remaining=$(( $(date -d "$COMMITTED_AT" +%s) + 60 - $(date +%s) ))
                  if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi

                  newer=$(gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?branch=main&per_page=20" \
                    --jq "[.workflow_runs[] | select(.run_number > $RUN_NUMBER and .status != \"completed\")] | length")
                  echo "Newer runs still to come: $newer"
                  echo "superseded=$([ "$newer" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
              env:
                  COMMITTED_AT: ${{ github.event.head_commit.timestamp }}
                  RUN_NUMBER: ${{ github.run_number }}
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}

    validate-and-deploy:
        runs-on: ubuntu-latest
        needs: wait
        # `!cancelled()` so a skipped wait (every commit that isn't a reaction)
        # doesn't skip the deploy with it, as a plain `needs` would.
        if: ${{ !cancelled() && needs.wait.result != 'failure' && needs.wait.outputs.superseded != 'true' }}

        steps:
            # Step 1: Checkout the repository
            - name: Checkout repository
              uses: actions/checkout@v4

            # Step 2: Validate JSON files
            - name: Validate JSON files
              run: |
                  # Everything the app imports at build time, plus overrides.json, which
                  # the derived-data steps below read. Validating first means a bad file
                  # fails here with its own name rather than deep inside a Python step.
                  for file in club.json films.json lists.json listFilms.json overrides.json responses.json trophies.json watched.json; do
                    path="src/assets/$file"
                    if [ -f "$path" ]; then
                      echo "Validating $file..."
                      if ! jq empty "$path"; then
                        echo "ERROR: $file is not valid JSON"
                        exit 1
                      fi
                      echo "$file is valid"
                    fi
                  done

            # Step 3: Set up Python for the derived-data steps
            #
            # These run here rather than in their own workflow because a commit made
            # with the default GITHUB_TOKEN does not trigger further workflow runs — a
            # standalone workflow would need its own build-and-deploy job. They can't
            # live in sync-google-sheet.yml either: that runs twice a day, so a
            # member's edit would sit invisible for up to twelve hours.
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install requests

            # Step 4: Build the films members added on the site.
            #
            # Before the overlay below, and that order is the design: this step
            # creates the entry from OMDb and TMDb, the next one fills in its
            # selector, watch date, art, and scores from the same file that asked
            # for it. A no-op unless someone added a film.
            - name: Create submitted films
              run: python .github/scripts/create_submitted_films.py
              env:
                  JSON_PATH: 'src/assets/films.json'
                  OVERRIDES_PATH: 'src/assets/overrides.json'
                  OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
                  # Unset, a new film lands with OMDb data alone and a later
                  # sheet sync backfills the crew; nothing fails for want of it.
                  TMDB_KEY: ${{ secrets.TMDB_KEY }}

            # Step 5: Fold member edits into films.json (deterministic; no network)
            - name: Apply member overrides
              run: python .github/scripts/apply_overrides.py
              env:
                  JSON_PATH: 'src/assets/films.json'
                  OVERRIDES_PATH: 'src/assets/overrides.json'

            # Step 6: Fill the poster/title cache for films the club never watched —
            # the ones on member lists, the ones in member watch logs, and the ones
            # a member named for their profile banner.
            - name: Enrich list films
              run: python .github/scripts/enrich_list_films.py
              env:
                  LISTS_PATH: 'src/assets/lists.json'
                  WATCHED_PATH: 'src/assets/watched.json'
                  CLUB_PATH: 'src/assets/club.json'
                  JSON_PATH: 'src/assets/films.json'
                  LIST_FILMS_PATH: 'src/assets/listFilms.json'
                  OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
                  # Posters come from OMDB, trailers from TMDb — the same key the
                  # sheet sync uses. Unset, the summaries land without a trailer
                  # and a later deploy fills them in; nothing fails for want of it.
                  TMDB_KEY: ${{ secrets.TMDB_KEY }}

            # Step 7: Commit whatever those three steps derived, before the build,
            # so the deployed site never shows a half-applied state. All three are
            # no-ops on the source-only pushes that make up most deploys.
            #
            # `persons.json` rides along because a newly created film references
            # TMDb people nobody has a record for yet; without it the credits on
            # the film that was just added would link to nothing.
            - name: Commit derived data
              run: |
                  git add src/assets/films.json src/assets/listFilms.json src/assets/persons.json
                  if git diff --staged --quiet; then
                    echo "No derived data changes to commit."
                    exit 0
                  fi
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git commit -m "Add submitted films, apply member overrides, enrich list films"
                  # The worker commits to main while this runs, so rebase onto whatever
                  # landed in the meantime rather than failing the deploy on a stale ref.
                  git pull --rebase --autostash
                  git push

            # Step 8: Setup Bun
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Step 9: Install dependencies
            - name: Install dependencies
              run: bun install

            # Step 10: Build the project
            #
            # The two editing settings are repository *variables*, not secrets: both
            # are public by design (the client ID is sent by the browser, the worker
            # URL is the address it calls). Unset, they build a site with no editing
            # surfaces at all rather than a broken one.
            - name: Build the project
              run: bun run build
              env:
                  VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
                  VITE_EDITOR_API_URL: ${{ vars.EDITOR_API_URL }}

            # Step 11: Verify build output
            - name: Verify build output
              run: |
                  echo "Checking build output directory..."
                  ls -la
                  if [ -d "dist" ]; then
                    echo "dist directory exists"
                    ls -la dist
                  else
                    echo "ERROR: dist directory does not exist"
                    exit 1
                  fi

            # Step 12: Deploy to GitHub Pages
            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  publish_branch: gh-pages
