name: Run Frontend Tests

on:
  push:
    branches:
      - main 
  pull_request:
    branches:
      - main 

permissions:
  contents: read 

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest 

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      # The editing worker deploys on its own and isn't in the site's tsconfig
      # project references, so the typecheck above doesn't see it. Its trust
      # boundary (validate.ts) is pure and its tests run in the site suite; this
      # step is what checks the half that touches the Workers runtime.
      - name: Typecheck the editing worker
        working-directory: worker
        run: |
          bun install
          bun run typecheck
