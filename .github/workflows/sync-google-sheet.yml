name: Sync and Deploy

on:
    schedule:
        - cron: '0 19 * * *'
        - cron: '0 3 * * *'
    workflow_dispatch:

# `actions: write` lets the last step dispatch deploy.yml. This workflow no
# longer builds or publishes anything itself, so it needs no Pages permissions.
permissions:
    contents: write
    actions: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pandas requests

            - name: Run sync script
              run: python .github/scripts/sync_sheet_to_json.py
              env:
                  SHEET_ID: '1wGrX2xWrJlS6WFpNxzD73VrHW4ZnrfedjtK5C9EYeuw'
                  JSON_PATH: 'src/assets/films.json'
                  OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
                  TMDB_KEY: ${{ secrets.TMDB_KEY }}

            - name: Check for changes
              id: check_changes
              run: |
                  git add src/assets/films.json src/assets/persons.json
                  if git diff --staged --quiet; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                  else
                    echo "changed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Commit changes
              if: steps.check_changes.outputs.changed == 'true'
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git commit -m "Auto-update films.json from Google Sheet and OMDB"
                  # The sync spends minutes on OMDb and TMDb calls, and the worker
                  # commits member edits to main the whole time, so rebase onto
                  # whatever landed rather than failing the push on a stale ref.
                  git pull --rebase --autostash
                  git push

            # Deploying is deploy.yml's job, not this workflow's. Building here meant
            # a second, drifting copy of that pipeline: it built without the editing
            # variables (publishing a site nobody could edit) and sat outside the
            # `pages-deploy` concurrency group (so it could overwrite a newer deploy
            # with an older build). The push above can't start deploy.yml, because
            # commits made with GITHUB_TOKEN don't trigger workflows, but a
            # workflow_dispatch made with it does.
            - name: Trigger deploy
              if: github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.changed == 'true'
              run: gh workflow run deploy.yml --ref main
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
