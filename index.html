<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/pillar.svg" />
        <link rel="apple-touch-icon" href="/pillar-180x180.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0f172b" />

        <!-- Primary SEO -->
        <title>Criterion Club — Films we watch, rate, and review</title>
        <meta
            name="description"
            content="Four friends working through the Criterion Channel. Browse the catalog, every member rating and review, and an almanac of club statistics."
        />
        <link rel="canonical" href="https://criterionclub.org/" />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph (Facebook, iMessage, Slack, etc.). The card is generated
             from the site's own pillar motif — see scripts/generate_brand_assets.py. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Criterion Club" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:title" content="Criterion Club — Films we watch, rate, and review" />
        <meta
            property="og:description"
            content="Four friends working through the Criterion Channel. Browse the catalog, every member rating and review, and an almanac of club statistics."
        />
        <meta property="og:url" content="https://criterionclub.org/" />
        <meta property="og:image" content="https://criterionclub.org/og-card.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Criterion Club — an Ionic pillar over the club's name on a dark slate field"
        />

        <!-- Twitter / X Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Criterion Club — Films we watch, rate, and review" />
        <meta
            name="twitter:description"
            content="Four friends working through the Criterion Channel. Browse the catalog, every member rating and review, and an almanac of club statistics."
        />
        <meta name="twitter:image" content="https://criterionclub.org/og-card.png" />
        <meta
            name="twitter:image:alt"
            content="Criterion Club — an Ionic pillar over the club's name on a dark slate field"
        />

        <!-- Structured data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "Criterion Club",
                "url": "https://criterionclub.org/",
                "description": "Four friends working through the Criterion Channel. Browse the catalog, every member rating and review, and an almanac of club statistics.",
                "image": "https://criterionclub.org/og-card.png"
            }
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <script
            defer
            src="https://analytics.jacobkrch.com/script.js"
            data-website-id="cf049bd4-9cd4-415d-a262-bbe799aacccd"
        ></script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
